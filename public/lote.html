<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%279%27 fill=%27%231f6aa5%27/%3E%3Crect x=%277%27 y=%2713%27 width=%2718%27 height=%277%27 rx=%271%27 fill=%27%23ffe04a%27/%3E%3C/svg%3E">
  <title>Assinar contratos em lote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=Lexend:wght@300..700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="/estatico/app.css">
  <script type="module" src="/estatico/lote.js"></script>
</head>
<body>
  <header class="topo">
    <p class="emissor" id="emissor">Carregando…</p>
    <h1 id="titulo"></h1>
  </header>

  <main class="conteudo">
    <ol class="etapas" id="etapas" hidden>
      <li data-etapa="identificar">Identificação</li>
      <li data-etapa="ler">Leitura</li>
      <li data-etapa="assinar">Assinatura</li>
    </ol>

    <div id="erro-geral" class="aviso erro" role="alert" hidden></div>

    <section id="tela-identificar" class="estreito" hidden>
      <div class="cartao">
        <h2 id="saudacao"></h2>
        <p id="explica"></p>
        <div id="pedir-codigo"><button class="botao largo" id="btn-pedir">Enviar código</button></div>
        <form id="form-codigo" hidden>
          <label class="campo">
            <span>Código de 6 dígitos</span>
            <input id="codigo" class="codigo-otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
            <small id="codigo-destino"></small>
          </label>
          <div id="erro-codigo" class="aviso erro" role="alert" hidden></div>
          <button class="botao largo" type="submit">Confirmar código</button>
          <button class="link-botao" type="button" id="btn-reenviar">Enviar outro código</button>
        </form>
      </div>
    </section>

    <section id="tela-ler" hidden>
      <p class="aviso info" id="explica-modelo"></p>
      <article class="documento" id="documento" aria-label="Texto do modelo"></article>
      <p class="nota-bula">Os resumos em amarelo explicam cada cláusula em palavras simples; o que vale é o texto do modelo, logo abaixo. Os campos sublinhados em azul são preenchidos com os dados de cada pessoa, mostrados na tabela abaixo.</p>
      <section class="cartao tabela-lote">
        <h2 id="titulo-tabela"></h2>
        <div class="rolagem"><table class="tabela" id="tabela"></table></div>
      </section>
      <div class="fim-leitura" id="fim-leitura"></div>
    </section>

    <section id="tela-assinar" class="estreito" hidden>
      <div class="cartao">
        <h2 id="titulo-assinar"></h2>
        <ul class="resumo-assinatura" id="resumo-assinatura"></ul>
        <form id="form-assinar">
          <label class="campo">
            <span>Digite seu nome completo</span>
            <input id="nome" autocomplete="name" required>
            <small id="nome-dica"></small>
          </label>
          <label class="check">
            <input type="checkbox" id="concordo" required>
            <span id="texto-concordo"></span>
          </label>
          <label class="check">
            <input type="checkbox" id="geo">
            <span>Registrar minha localização junto da assinatura (opcional).</span>
          </label>
          <div id="erro-assinar" class="aviso erro" role="alert" hidden></div>
          <button class="botao largo" type="submit" id="btn-assinar"></button>
        </form>
        <div class="acoes-secundarias">
          <button class="link-botao" id="btn-voltar-ler" type="button">Voltar ao texto e à tabela</button>
        </div>
      </div>
    </section>

    <section id="tela-fim" class="estreito" hidden>
      <div class="cartao" id="fim"></div>
    </section>
  </main>

  <nav class="barra" id="barra" hidden aria-label="Progresso da leitura">
    <div class="dentro">
      <div>
        <div class="progresso" id="progresso" aria-live="polite"></div>
        <div class="trilho" aria-hidden="true" id="trilho"></div>
      </div>
      <button class="botao" id="btn-ir-assinar" disabled>Ir para assinatura</button>
    </div>
  </nav>
</body>
</html>
