name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint:modelos
      # A imagem que o host vai usar precisa construir; sem Docker na máquina do Davi, é o CI que confere.
      - run: docker build -t bullacheck:ci .
      # Vulnerabilidade conhecida avisa, mas não derruba o commit: a decisão é humana.
      - run: npm audit --audit-level=high
        continue-on-error: true
